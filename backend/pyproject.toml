[project]
name = "url-shortner-api"
version = "0.1.0"
description = "FastAPI backend for the url-shortner project"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Three weeks, as a rolling window. Applies to transitive dependencies too.
# Malicious releases are typically pulled from the registry within an hour,
# so this window means a compromised version is never eligible for install.
exclude-newer = "21 days"

# Refuse to build source distributions: an sdist's setup.py executes arbitrary
# code at install time. If a dependency has no wheel, stop and decide -- do not
# flip this to false.
no-build = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (incl. syntax errors), I imports, B bugbear, UP pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations) would otherwise make the real package look first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
